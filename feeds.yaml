# Each feed is one product. The prefilter keeps only passages that match a feed's
# patterns, so the AI read (the only per-document cost) runs on a small slice of text.
energy:
  title: "Council Radar: Ontario Energy Projects"
  audience: >-
    Developers, consultants and lawyers working on Ontario electricity projects (battery
    storage, solar, wind, gas, hydrogen, LDES) who need municipal support confirmations for
    IESO procurements (LT2, LLT) and must track local policy affecting siting.
  patterns:
    - '\bIESO\b'
    - 'Independent Electricity System Operator'
    - '\bLT2\b|\bLLT\b|Long[- ]Lead[- ]Time|Long[- ]Term 2'
    - 'municipal support (resolution|confirmation)'
    - '\bMSC\b|\bMSR\b|\bMRSPS\b'
    - 'battery (energy )?storage|battery (facility|system|project|installation|site)s?|\bBESS\b|energy storage'
    - 'solar (farm|project|facility|energy|array|panel|installation|generation)s?|photovoltaic|ground[- ]mount(ed)? solar'
    - 'wind (turbine|farm|project|energy|power)s?'
    - 'electricity (generation|storage)|generating (station|facility)|energy (project|facility|centre|center)s?'
    - 'transmission (line|corridor|project)s?|\bHydro One\b'
    - 'unwilling host'
    - 'renewable energy (project|facility|approval)'
    - 'community benefit agreement'
    - 'hydrogen (peaker|plant)|natural gas (plant|generation)|peaker plant'
  categories:
    - support_request      # proponent asks council for an MSC / MSR
    - support_granted      # council grants support
    - support_denied       # council refuses / defers / issues "acknowledgement only"
    - policy_protocol      # council adopts or directs a protocol, criteria, blanket resolution
    - zoning_bylaw         # zoning / official plan / interim control affecting energy siting
    - delegation           # proponent or residents present; early signal
    - other_relevant
str_rules:
  title: "Council Radar: Ontario Short-Term Rental Rules"
  audience: Short-term rental hosts and property managers in Ontario.
  enabled: false
  patterns:
    - 'short[- ]term rental'
    - '\bSTR\b'
    - 'municipal accommodation tax|\bMAT\b'
  categories: [bylaw_passed, bylaw_proposed, fee_change, enforcement, other_relevant]
housing:
  title: "Council Radar: Ontario Land Development & Housing"
  audience: >-
    Homebuilders, land developers, planning consultants, land-use lawyers and REITs who need
    every council and committee move on official plan and zoning by-law amendments, plans of
    subdivision and condominium, site plans, large minor variances, MZOs, development charges,
    CIPs and the local rollout of Bills 23, 185, 17 and 60.
  # Launched 2026-11-24 (Huxley): same $59 founding / $249 team Stripe links, tagged ?client_reference_id=housing.
  enabled: true
  patterns:
    - 'official plan amendment|\bOPA\b'
    - 'zoning by-?law amendment|\bZBLA\b|\bZBA\b|\bre-?zoning\b'
    - '(draft )?plan of (subdivision|condominium)|\b(subdivision|condominium) agreement|extension of draft (plan )?approval|lapsing of (draft )?approval'
    - 'site plan (approval|application|control|agreement)'
    # minor variances only when the item is about a sizeable development (unit counts / storeys)
    - 'minor variance[\s\S]{0,400}?\b\d{2,4}[- ](residential |dwelling |townhouse |apartment )?(units?|storeys?|dwellings)\b'
    - "Minister'?s zoning order|\\bMZO\\b|zoning order"
    - 'community improvement plan'   # not bare "CIP": councils use it for "Council Information Package"
    - 'development charges? (by-?law|background study|study|deferral|exemption|reduction|rates?|freeze)'
    - '\bBill (23|185|17|60|109)\b|More Homes Built Faster|Cutting Red Tape,? Building More Homes|Protect Ontario by Building Faster|Fighting Delays,? Building Faster'
    - 'housing (pledge|target)s?|Building Faster Fund|Housing Accelerator Fund'
    - 'inclusionary zoning|(protected )?major transit station area|\bPMTSA\b'
    - 'interim control by-?law'
    - 'Ontario Land Tribunal|\bOLT\b'
    - 'parkland dedication|cash[- ]in[- ]lieu of parkland'
    - 'servicing allocation|(water|wastewater) (servicing )?(capacity )?allocation'
    - 'additional residential units?'
  categories:
    - opa                    # official plan amendment (new, recommended, adopted, refused)
    - zba                    # zoning by-law amendment / rezoning
    - subdivision_condo      # draft plan of subdivision or condominium, extensions, lapsing
    - site_plan              # site plan approval or agreement (large projects)
    - minor_variance_major   # committee of adjustment item tied to a sizeable project
    - mzo                    # minister's zoning order requested, endorsed or opposed
    - dc_cip_incentive       # development charges, CIPs, fee deferrals and exemptions
    - provincial_rollout     # local implementation of Bills 23/185/17/60, PPS conformity
    - target_funding         # housing targets, Building Faster Fund, Housing Accelerator Fund
    - olt_appeal             # Ontario Land Tribunal appeals and settlements
    - servicing_allocation   # water / wastewater capacity allocated to projects
    - other_relevant
datacentres:
  title: "Council Radar: Ontario Data Centres & Large Loads"
  audience: >-
    Data centre developers and operators, industrial landowners marketing "data-centre-ready"
    sites, power developers offering bring-your-own-generation, utilities, site selectors and
    the energy and land-use lawyers advising them, who need every council move on data centre
    pauses (interim control by-laws), zoning and official plan policy, specific site
    applications, water and power servicing, and municipal responses to Ontario's Data Centre
    Playbook (ERO 026-0853) and Bill 40.
  # Collect-only beta from 2026-11-26 (expansion memo ops/expansion/2026-11-26-data-centres.md).
  # Excerpts are saved daily; nothing is built or sent. Launch when the memo's bar is met.
  enabled: false
  collect: true
  patterns:
    - 'data cent(re|er)s?|data[- ]processing (facility|centre|center)s?'
    - 'hyperscale|co-?location (facility|facilities|data)|server farms?'
    - 'large (computational|electricity|power) (loads?|users?)|large[- ]load (facility|facilities|customers?)'
    - '\bAI (data|compute|computing) (cent(re|er)s?|facilit(y|ies)|campus(es)?)|artificial intelligence (data|compute|computing)'
    - 'Data Cent(re|er)s? Playbook|026-0853|Economic and Strategic Assessment Framework'
    - '\bBill 40\b'
    - 'crypto(currency)?[- ]mining|bitcoin mining|digital asset mining'
  categories:
    - pause_icbl            # interim control by-law, moratorium or pause (proposed, passed, defeated, extended)
    - land_use_policy       # OP / zoning policy, permitted-use definitions, planning study directions
    - site_application      # a specific data centre: rezoning, site plan, severance, sale of municipal land
    - servicing_power       # water, wastewater, hydro / grid capacity for data centres
    - provincial_response   # comments on the Playbook, ERO 026-0853, Bill 40; circulated resolutions
    - delegation            # proponent or residents present; early signal
    - other_relevant
