name: probe-urls
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe.py ${{ github.event.inputs.urls }}
