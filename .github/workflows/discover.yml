name: discover-portals
on:
  schedule:
    - cron: "7 9 1 * *"   # monthly
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar-data
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m radar discover
      - name: Save data
        run: |
          git config user.name "council-radar-bot"
          git config user.email "council-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: discovered portals $(date -u +%F)"
          git push
