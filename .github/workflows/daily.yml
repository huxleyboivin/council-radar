name: daily-collect
on:
  schedule:
    - cron: "23 10 * * *"   # ~5:23 a.m. Toronto
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated municipality slugs (blank = all)"
        required: false
      refresh:
        description: "Re-scan past agendas in the window (after editing feeds.yaml)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: radar-data
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collect and read new council documents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then EXTRA="--refresh"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m radar run --only "${{ github.event.inputs.only }}" $EXTRA
          else
            python -m radar run $EXTRA
          fi
      - run: python -m radar health
        if: always()
      - name: Save data
        if: always()
        run: |
          git config user.name "council-radar-bot"
          git config user.email "council-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily collect $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep $((i*7)); done
