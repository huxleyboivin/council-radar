name: validate-detection
# One-off check that the reader finds known energy items in past meetings. Saves nothing.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Municipality slug"
        required: true
        default: greatersudbury
      lookback:
        description: "Days to look back"
        required: true
        default: "400"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collect into a throwaway folder
        env:
          RADAR_LOOKBACK_DAYS: ${{ github.event.inputs.lookback }}
          RADAR_LOOKAHEAD_DAYS: "0"
          RADAR_DB: /tmp/validate/radar.db
          RADAR_DATA_DIR: /tmp/validate
        run: |
          mkdir -p /tmp/validate && cp data/discovered.yaml /tmp/validate/
          python -m radar run --only "${{ github.event.inputs.slug }}"
          python -m radar pending --since 0000-00-00 | python -c "import sys,json; d=json.load(sys.stdin); print('EXCERPTS', d['count']); [print('HIT', e['meeting_date'], e['meeting_name'], '|', e['excerpt'][:300].replace(chr(10),' ')) for e in d['excerpts'][:15]]"
