name: publish-site
on:
  push:
    branches: [main]
    paths: ["site/**", "radar/tracker.py"]
  # Rebuild after each daily collect so the "Check your council" lookup on the
  # landing page (next meetings, public decisions, subscriber-item counts) stays fresh.
  workflow_run:
    workflows: [daily-collect]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Refresh tracker and council lookup data
        run: python -m radar tracker || echo "Tracker build failed; publishing the committed site as is."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
