name: debug-portal
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Municipality slug to inspect"
        required: true
        default: ottawa
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m radar debug "${{ github.event.inputs.slug }}"
