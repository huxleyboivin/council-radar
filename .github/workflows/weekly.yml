name: weekly-issue
# Paid-delivery path (Anthropic API + Buttondown). Off by default: in no-cost mode the
# weekly issue is written and sent by a Claude scheduled task (see ops/weekly_task.md).
# To switch on later, add the schedule back:  - cron: "41 11 * * 1"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar-data
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build and deliver this week's issue
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          # Starts as "draft" so the first issues can be checked; switch the repo
          # variable RADAR_DELIVERY_MODE to "send" to go fully automatic.
          RADAR_DELIVERY_MODE: ${{ vars.RADAR_DELIVERY_MODE || 'draft' }}
        run: |
          if [ -n "$BUTTONDOWN_API_KEY" ]; then python -m radar digest --deliver; else python -m radar digest; fi
      - name: Save data
        run: |
          git config user.name "council-radar-bot"
          git config user.email "council-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: weekly issue $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep $((i*7)); done
