name: weekly-issue
# Buttondown delivery of the issue the Monday Claude task rendered (data/issues/<date>-energy.md).
# Does nothing until the BUTTONDOWN_API_KEY secret exists. Starts in "draft" mode (drafts to review in
# Buttondown); set the repo variable RADAR_DELIVERY_MODE to "send" only after the switch-over checklist
# in ops/buttondown_migration.md, so subscribers never get the issue from both Gmail and Buttondown.
on:
  schedule:
    - cron: "11 14 * * 1"   # Mondays 9:11 a.m. Toronto (EST), after the 7:23 weekly task pushes the issue
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar-data
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Deliver this week's issue through Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          RADAR_DELIVERY_MODE: ${{ vars.RADAR_DELIVERY_MODE || 'draft' }}
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then echo "BUTTONDOWN_API_KEY not set; nothing to do"; exit 0; fi
          last=$(cat data/issues/last_issue.txt)
          if [ "$last" != "$(TZ=America/Toronto date +%F)" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Latest issue is $last, not today; the weekly task hasn't rendered this week's issue. Not sending."; exit 0
          fi
          python -m radar send-issue
      - name: Save data
        run: |
          git config user.name "council-radar-bot"
          git config user.email "council-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: weekly issue $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep $((i*7)); done
