name: agenda-check
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated municipality slugs"
        required: true
        default: "ottawa haldimandcounty kincardine brucecounty"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m tools.agenda_check ${{ github.event.inputs.slugs }}
